services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leadlens
      POSTGRES_PASSWORD: leadlens
      POSTGRES_DB: leadlens
    ports:
      - "${POSTGRES_PORT:-5442}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadlens"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # `docker compose --profile app up --build` runs the full stack in containers.
  # By default only infra starts and the app runs on the host with `npm run dev`.
  migrate:
    profiles: ["app"]
    build: .
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts"
    environment: &app-env
      DATABASE_URL: postgresql://leadlens:leadlens@postgres:5432/leadlens
      REDIS_URL: redis://redis:6379
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    profiles: ["app"]
    build: .
    command: npm run start
    ports:
      - "3000:3000"
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    profiles: ["app"]
    build: .
    command: npm run worker
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:
